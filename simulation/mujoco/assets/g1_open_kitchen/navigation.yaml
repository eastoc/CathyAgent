schema_version: 1
frame: world
map:
  bounds_min_xy_m: [-1.0, -3.0]
  bounds_max_xy_m: [7.0, 3.0]
  resolution_m: 0.05
  unknown_is_occupied: true
robot_start:
  position_xy_m: [0.0, 0.0]
  yaw_rad: 0.0
landmarks:
  - name: fridge
    label: 冰箱
    geom: fridge_body
    navigable_surface: false
  - name: sink
    label: 水槽
    geom: back_counter_top
    navigable_surface: false
  - name: island
    label: 中央岛台
    geom: island_top
    navigable_surface: false
  - name: trash_bin
    label: 垃圾桶
    geom: trash_bin_geom
    navigable_surface: false
# 以下固定点只用于物理回归。Agent 正式导航必须从 get_map 选择地面坐标。
targets:
  - name: fridge
    site: goal_fridge
    position_xy_m: [5.55, 1.82]
    facing_xy_m: [6.30, 2.02]
  - name: sink
    site: goal_sink
    position_xy_m: [3.40, 1.66]
    facing_xy_m: [3.40, 2.48]
  - name: island_south
    site: goal_island_south
    position_xy_m: [3.35, -1.10]
    facing_xy_m: [3.35, 0.0]
static_obstacles:
  - north_wall
  - south_wall
  - west_wall
  - east_wall
  - back_counter_base
  - back_counter_top
  - island_base
  - island_top
  - fridge_body
  - trash_bin_geom
