llm:
  - name: qwen
    type: openai_compatible
    api_key: ${QWEN_API_KEY}          # 建议通过环境变量注入，不要硬编码
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3-plus
    temperature: 0.7
    max_tokens: 4096
    roles:
      - planner                       # 用于 Plan-and-Execute 的规划阶段
      - executor                      # 用于 ReAct 执行阶段

