LLM_API:
  - name: deepseek
    type: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    api_base: https://api.deepseek.com
    model: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 4096
    roles:
      - planner
      - executor

TAVILY_API_KEY: ${TAVILY_API_KEY}

AGENT:
  max_steps: 12
  # 系统提示词已迁移到 cathy/context.py（DEFAULT_SYSTEM_PROMPT），
  # 项目级规则请写入项目根的 AGENTS.md 或 CATHY.md，会自动注入。
  # 这里仅保留可选的临时附加指令：
  extra_system: ""

SESSION:
  db_path: data/sessions.db
  token_budget: 16000      # 历史消息硬截断的 token 预算（字符数/4 估算）
