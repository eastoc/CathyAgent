LLM_API:
  - name: deepseek
    type: openai_compatible
    api_key: ${DEEPSEEK_API_KEY}
    api_base: https://api.deepseek.com
    model: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 4096
    roles:
      - planner
      - executor

TAVILY_API_KEY: ${TAVILY_API_KEY}

AGENT:
  max_steps: 12
  # 系统提示词已迁移到 cathy/context.py（DEFAULT_SYSTEM_PROMPT），
  # 项目级规则请写入项目根的 AGENTS.md 或 CATHY.md，会自动注入。
  # 这里仅保留可选的临时附加指令：
  extra_system: ""

SESSION:
  db_path: data/sessions.db
  token_budget: 200000      # 历史消息硬截断的 token 预算（字符数/4 估算）

# MCP（Model Context Protocol）外部工具生态：
# - 形态对齐 Claude Code 的 mcpServers：本地 stdio 用 command/args/env；
#   远端用 url/headers，传输由 fastmcp 根据入参自动推断。
# - enabled=false 时整段忽略；fastmcp 未安装时自动跳过并打日志。
# - 工具名按 `mcp__<server>__<tool>` 注册到 PluginRegistry（与 Claude Code 同款）；
#   单 server / in-memory 测试场景退化为 `mcp__<tool>`。
# - Time MCP：官方实现为 Python 包 `mcp-server-time`（npm 上 **没有**
#   `@modelcontextprotocol/server-time`，用 npx 会 404）；见下方 `time` 段。
MCP:
  enabled: true
  connect_timeout_sec: 60      # 启动期连接 + tools/list 的总超时
  call_timeout_sec: 120        # 单次工具调用超时
  # 可选：FastMCP Client 暴露给 MCP 服务的 roots（filesystem 会回调 list_roots）。
  # 省略时自动从各 server 的 `@modelcontextprotocol/server-filesystem` 命令行路径推断。
  # roots:
  #   - /tmp
  #   - file:///Users/me/project
  mcp_servers:
    fs:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      env: {}
    memory:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory"]
      env: {}
    # 需 `pip install mcp-server-time`（已写入 requirements.txt）
    time:
      command: python
      args: ["-m", "mcp_server_time"]
      env: {}
    # FreeCAD 需先做：
    #   1) 把 https://github.com/neka-nat/freecad-mcp 的 `addon/FreeCADMCP`
    #      复制到 ~/Library/Application Support/FreeCAD/v1-1/Mod/ （macOS FreeCAD 1.1）。
    #   2) 启动 FreeCAD → 切到 “MCP Addon” 工作台 → 点击 “Start RPC Server”
    #      （可勾 Auto-Start Server 永久生效）。
    # 提示：加 `--only-text-feedback` 可让 freecad-mcp 不回传截图，省 token；
    # 想要 LLM 看 3D 视图截图时去掉这个参数。
    freecad:
      command: uvx
      args: ["freecad-mcp", "--only-text-feedback"]
      env: {}
  # 示例：
  # mcp_servers:
  #   fs:
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  #     env: {}
  #   remote:
  #     url: "https://mcp.example.com/mcp"
  #     headers:
  #       Authorization: "Bearer ${SOME_TOKEN}"

# hooks 配置档位：
# - mvp  (默认): 仅启用 UserPromptSubmit / PreToolUse / PostToolUse
# - full        : 启用 HOOKS 中全部事件
HOOKS_PROFILE: mvp

# Phase 3.5 中间件：8 类事件 + Python/Command 双后端。
# 形态与 Claude Code .claude/settings.json 的 hooks 段一致；
# 项目根若同时存在 .claude/settings.json，会自动 merge 在末尾。
#
# 默认开启的 3 件套都是演示性 hook，按需注释/删除；自定义 hook 推荐放到
#   plugins/community/<name>/hooks.py  + 在此引用 'cathy.hooks.builtin' 同款形态。
HOOKS:
  PreToolUse:
    - hooks:                       # 全工具权限闸门（按 trust_level + PERMISSION.mcp_rules）
        - type: python
          target: "cathy.hooks.builtin:permission_gate"
    # matcher 支持 glob，例如 "mcp__fs__write_*"、"mcp__*__delete_*"。
    - matcher: "write_file|mcp__fs__write_*|mcp__*__write_*"
      hooks:
        - type: python
          target: "cathy.hooks.builtin:block_dangerous_paths"
    - matcher: "shell_exec|mcp__*__shell|mcp__*__exec_*"
      hooks:
        - type: python
          target: "cathy.hooks.builtin:block_dangerous_shell_commands"
  PostToolUse:
    - hooks:                       # matcher 缺省 = 所有工具
        - type: python
          target: "cathy.hooks.builtin:audit_log"
  UserPromptSubmit:
    - hooks:
        - type: python
          target: "cathy.hooks.builtin:strip_secrets"

SANDBOX:
  enabled: true
  # mac 优先：seatbelt（py-sandboxrt）；若本机未装 py-sandboxrt 可先切 local_restricted
  backend: seatbelt                 # seatbelt | local_restricted
  workspace_root: workspaces
  default_timeout_sec: 10
  max_timeout_sec: 30
  max_output_bytes: 65536
  network:
    allow: false
    allowed_domains: []

PERMISSION:
  # trust_policy: allow | audit | ask | deny
  trust_policy:
    builtin: allow
    verified: audit
    untrusted: ask
  # 在脚本/服务等无 TTY 环境，ask 无法交互时的降级策略
  non_interactive_fallback: deny

  # mcp_rules：仅对 `mcp__*` 工具生效，按 deny → ask → allow 的优先级匹配，
  # 命中后直接覆盖 trust_policy 的判定（语义对齐 Claude Code `permissions` /
  # Cursor `mcpAllowlist`）。每条 pattern 走 fnmatch glob：
  #   * 任意字符串、? 任意单字符、[abc] 字符类。
  mcp_rules:
    deny:
      - "mcp__fs__delete_*"
      - "mcp__fs__move_*"
      # FreeCAD：默认禁止任意代码执行；要用时显式改为 ask 并人工确认。
    ask:
      - "mcp__fs__write_*"
      - "mcp__fs__edit_*"
      # FreeCAD：写类 / 删除 / 仿真等副作用动作需要人工确认。
      - "mcp__freecad__create_*"
      - "mcp__freecad__edit_*"
      - "mcp__freecad__delete_*"
      - "mcp__freecad__insert_*"
      - "mcp__freecad__run_fem_*"
      - "mcp__freecad__execute_code"
    allow:
      - "mcp__fs__read_*"
      - "mcp__fs__list_*"
      - "mcp__fs__search_*"
      - "mcp__fs__directory_tree"
      - "mcp__memory__*"
      - "mcp__time__*"
      # FreeCAD：只读类工具直接放行，便于模型探查文档/对象/视图。
      - "mcp__freecad__get_*"

# CAD Agent 产品层配置（见 ROADMAP_CAD_AGENT_v0.5.md §3.4）。
# - default_project_root 仅是兜底；CLI / SDK 入参（--project / Project.open(root)）优先。
# - freecad.backend 决定 cathy/cad/adapters/ 走哪条路；P1 之前可保持 freecad_mcp 占位。
# - library.*_catalog 路径相对仓库根；P3 落地后会真实指向文件。
# - qa.max_rounds 默认 3，对应 v0.5 §5.4 决策树。
# - permissions.stage_aware 与 PERMISSION.mcp_rules 互补：前者按 Stage 切换危险动作的 allow/ask/deny。
CAD_AGENT:
  enabled: true
  default_project_root: ~/cad_projects
  freecad:
    backend: freecad_mcp        # freecad_mcp | freecad_cmd | mock
    version_lock: "1.1"
  library:
    standard_catalog: cathy/cad/library/gb_catalog.yaml
    motor_catalog: cathy/cad/library/motor_catalog.yaml
    reducer_catalog: cathy/cad/library/reducer_catalog.yaml
    bearing_catalog: cathy/cad/library/bearing_catalog.yaml
  qa:
    max_rounds: 3
    auto_trigger_after:
      - summarize_part
      - summarize_assembly
    feedback_dir_name: qa_history
  permissions:
    allow_execute_code: ask
    stage_aware:
      S1: { mcp__freecad__execute_code: deny }
      S2: { mcp__freecad__execute_code: deny }
      S3: { mcp__freecad__execute_code: ask }
      S4: { mcp__freecad__execute_code: ask }
