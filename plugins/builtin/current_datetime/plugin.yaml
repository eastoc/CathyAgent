name: current_datetime
version: 0.1.0
description: 返回当前系统时间，避免模型幻觉时间。

tools:
  - name: get_current_datetime
    description: >-
      获取当前系统时间和日期。当用户询问 "今天几号 / 现在几点 / 今天星期几"，
      或需要做时间相关计算（N 天后、N 小时前等）时调用。
      返回 ISO 时间、可读日期、星期与时区。
    input_schema:
      type: object
      properties:
        timezone:
          type: string
          description: 可选 IANA 时区名，例如 'Asia/Shanghai' / 'UTC' / 'America/New_York'。不填则使用本机本地时区。
      required: []
      additionalProperties: false

permissions:
  network: none
  filesystem: none
  shell: false

execution:
  runtime: python
  entrypoint: main:CurrentDatetimePlugin
  timeout_seconds: 5
  sandbox: false

metadata:
  trust_level: builtin
  tags: [time]
